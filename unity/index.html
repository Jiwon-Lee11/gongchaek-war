<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공책전쟁">
<meta name="theme-color" content="#fbfaf4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>공책전쟁</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfaf4; overflow: hidden; font-family: sans-serif; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #fbfaf4; touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #2a4380; }
  #loading b { font-size: 40px; } #bar { width: min(70vw, 420px); height: 16px; border: 3px solid #2a4380; border-radius: 10px; overflow: hidden; background: #fff; }
  #fill { height: 100%; width: 0; background: #ffe066; }
  #sa { position: fixed; visibility: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-top: env(safe-area-inset-top); }
  /* 폰을 세로로 들고 있어도 게임은 가로로: 화면 전체를 90도 돌림 (브라우저는 회전 잠금을 풀 수 없어서) */
  body.fake { position: fixed; left: 0; top: 0; width: 100vh; height: 100vw; width: 100dvh; height: 100dvw; transform-origin: top left; transform: translateX(100vw) rotate(90deg); }
  body.fake #unity-canvas { top: 0; bottom: auto; width: 100dvh; height: 100dvw; }
  body.fake #rot { display: none; }
  /* 세로 화면: 게임을 막지 않고 16:9로 작게 보여줌 (회전 잠금·카톡 안 브라우저에서도 플레이 가능) */
  #rot { position: fixed; left: 16px; right: 16px; top: 16px; display: none; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: #2a4380; font-size: 18px; line-height: 1.5; z-index: 9; }
  #rot small { font-size: 14px; opacity: .8; }
  #rot button { display: none; padding: 10px 18px; font-size: 18px; font-weight: bold; color: #2a4380; background: #ffe066; border: 3px solid #2a4380; border-radius: 12px; }
  @media (orientation: portrait) { #rot { display: flex; } #unity-canvas { top: calc((100dvh - 56.25vw) / 2); bottom: auto; height: 56.25vw; } }
</style>
</head>
<body>
<div id="sa"></div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><b>공책전쟁</b><div id="bar"><div id="fill"></div></div><div id="msg">공책 펼치는 중… (처음엔 1~2분 걸려요 · 와이파이 추천)</div></div>
<div id="rot"><div>📱 폰을 <b>가로로</b> 돌리면 크게 보여요</div><small>안 돌아가면 화면 회전 잠금을 꺼주세요. 세로로도 플레이할 수 있어요.</small><button id="rotBtn">가로 전체화면으로 보기</button></div>
<script src="Build/WebGL.loader.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
<script>
  const canvas = document.getElementById("unity-canvas");
  // 가로로 눕힌 아이폰: 카메라가 있는 쪽만 비워서 왼쪽 메뉴가 가려지지 않게 (양쪽 다 비우면 화면이 너무 작아짐)
  const q0 = new URLSearchParams(location.search), wantFake = q0.has("fake") || (matchMedia("(pointer: coarse)").matches && q0.get("rotate") !== "0"); let fake = false, safeL = 0;
  function fitSafe() { const cs = getComputedStyle(document.getElementById("sa")), a = window.orientation ?? (screen.orientation ? screen.orientation.angle : 0); let l = parseFloat(cs.paddingLeft) || 0, r = parseFloat(cs.paddingRight) || 0;
    fake = wantFake && innerHeight > innerWidth; document.body.classList.toggle("fake", fake);
    if (fake) { safeL = parseFloat(cs.paddingTop) || 0; canvas.style.left = safeL + "px"; canvas.style.width = `calc(100dvh - ${safeL}px)`; return; }
    safeL = 0; if (innerHeight > innerWidth) { canvas.style.left = canvas.style.width = ""; return; } if (a === 90) r = 0; else if (a === -90 || a === 270) l = 0; canvas.style.left = l + "px"; canvas.style.width = `calc(100vw - ${l + r}px)`; }
  // 돌린 화면에 맞춰 터치·마우스 좌표도 돌려서 게임에 넘김
  function turn(C) { if (!C) return; const P = C.prototype, g = k => Object.getOwnPropertyDescriptor(P, k); const cx = g("clientX"), cy = g("clientY"); if (!cx || !cy) return; const def = (k, o, f) => { if (o) Object.defineProperty(P, k, { configurable: true, get() { return fake ? f.call(this) : o.get.call(this); } }); };
    const X = function () { return cy.get.call(this); }, Y = function () { return innerWidth - cx.get.call(this); }; def("clientX", cx, X); def("clientY", cy, Y); def("pageX", g("pageX"), X); def("pageY", g("pageY"), Y); }
  turn(window.MouseEvent); turn(window.Touch);
  { const rect = canvas.getBoundingClientRect.bind(canvas); canvas.getBoundingClientRect = () => { if (!fake) return rect(); const w = canvas.clientWidth, h = canvas.clientHeight; return { left: safeL, top: 0, right: safeL + w, bottom: h, width: w, height: h, x: safeL, y: 0 }; }; }
  fitSafe(); addEventListener("resize", fitSafe); addEventListener("orientationchange", () => setTimeout(fitSafe, 200));
  // 새 버전 안내: 켜둔 채로 배포되면 5분마다 확인해서 위쪽에 알려줌
  (function () { let first = null; async function check() { try { const r = await fetch("version.txt?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return; const v = (await r.text()).trim(); if (first === null) first = v; else if (v !== first && !document.getElementById("upd")) { const b = document.createElement("button"); b.id = "upd"; b.textContent = "새 버전이 나왔어요! 눌러서 새로고침"; b.style.cssText = "position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:50;padding:8px 16px;font-size:16px;font-weight:bold;background:#ffe066;color:#2a4380;border:3px solid #2a4380;border-radius:12px"; b.onclick = () => location.reload(); document.body.append(b); } } catch (e) {} } check(); setInterval(check, 300000); })();
  // 소리: 아이폰 무음 스위치를 켜면 게임 소리도 꺼지게 (대표 결정)
  if (navigator.audioSession) navigator.audioSession.type = "ambient";
  // 입력창이 떠 있으면 키 입력을 Unity에 안 넘김 (Unity보다 먼저 등록해야 해서 여기 있음. Unity는 키를 가로채서 입력칸에 글자가 안 들어감)
  for (const t of ["keydown", "keypress", "keyup"]) window.addEventListener(t, e => { if (window.GWModalOpen) e.stopImmediatePropagation(); }, true);
  // 안드로이드 크롬은 버튼으로 가로 고정 가능 (아이폰 사파리는 지원 안 해서 버튼을 숨김)
  const rotBtn = document.getElementById("rotBtn"), de = document.documentElement;
  if (!wantFake && de.requestFullscreen && screen.orientation && screen.orientation.lock) { rotBtn.style.display = "block";
    rotBtn.onclick = () => de.requestFullscreen().then(() => screen.orientation.lock("landscape")).catch(() => {}); }
  // 파일 이름이 늘 같아서 브라우저가 옛 코드(10분 캐시)와 새 데이터를 섞으면 실행이 터짐. 파일마다 버전을 붙여 한 벌만 받게 함
  (async () => { const q = new URLSearchParams(location.search), retry = q.get("retry"); let v = ""; try { const r = await fetch("version.txt?t=" + Date.now(), { cache: "no-store" }); if (r.ok) v = "?v=" + (await r.text()).trim(); } catch (e) {} if (retry) v += (v ? "&" : "?") + "r=" + retry;
  createUnityInstance(canvas, {
    dataUrl: "Build/WebGL.data" + v, frameworkUrl: "Build/WebGL.framework.js" + v, codeUrl: "Build/WebGL.wasm" + v,
    streamingAssetsUrl: "StreamingAssets", companyName: "5Billion", productName: "공책전쟁", productVersion: "1.0",
    matchWebGLToCanvasSize: true, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    // "Script error."는 브라우저가 내용을 가린 오류(확장 프로그램 등 다른 곳에서 난 것일 수 있음). 게임은 계속 돌 수 있으니 팝업으로 막지 않음
    errorHandler: (m) => { const t = String(m).trim(); console.warn("게임 오류:", t); return /^Script error\.?$/i.test(t); },
  }, p => { document.getElementById("fill").style.width = (p * 100) + "%"; })
  .then(() => { document.getElementById("loading").remove(); })
  .catch(e => { if (!retry) { q.set("retry", Date.now()); location.search = q.toString(); return; } document.getElementById("msg").textContent = "실행 실패: " + String(e).slice(0, 200) + " — 사파리/크롬 최신 버전으로 열어주세요"; }); })();   // 한 번은 새로 받아서 자동 재시도
</script>
</body>
</html>
